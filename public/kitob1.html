<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Говорим по-русски! · Kitob 1 · Akademiya Pushkina</title>
<meta name="theme-color" content="#3b2a7a">
<style>
:root{--ink:#1d1b3a;--muted:#6b6790;--card:rgba(255,255,255,.86);--line:rgba(60,40,140,.12);--accent:#ff8a3d;--gold:#ffc94d;--blue:#3f5bd9;--green:#18a77a;--red:#e5484d;--purple:#7c4ddb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);
  background:linear-gradient(170deg,#2d2470 0%,#5b3a8c 38%,#b8628a 72%,#f4a77a 100%) fixed;padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 0}
header.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
header.top .logo{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex:none}
header.top .t{font-size:13px;line-height:1.25;opacity:.95}
header.top .t b{display:block;font-size:15px;letter-spacing:1px;color:var(--gold)}
.hero{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(20,10,60,.25)}
.badge{flex:none;width:64px;height:76px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#3f5bd9,#2b3fa8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;box-shadow:0 6px 14px rgba(40,60,170,.35)}
.badge small{font-size:10px;letter-spacing:1.5px;font-weight:700;opacity:.9}
.hero h1{margin:0;font-size:24px;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--accent);font-style:italic;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 12px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.tab.on{background:#fff;color:#3b2a7a;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(20,10,60,.2)}
.card h2{margin:0 0 4px;font-size:19px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:linear-gradient(135deg,#fff4e6,#ffe7d1);border:1px solid #ffd2a8;border-radius:16px;padding:10px 12px;margin-bottom:12px}
.player audio{width:100%;height:38px}
.playall{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;padding:10px 16px;font-size:14px;cursor:pointer;flex:none;box-shadow:0 4px 10px rgba(255,138,61,.35)}
.playall.stop{background:var(--red)}
.note{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .15s}
.item:last-child{border-bottom:0}
.item:active,.item.playing{background:rgba(255,201,77,.28)}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:#eef1ff;color:var(--blue);display:grid;place-items:center;font-size:17px}
.item.playing .spk{background:var(--accent);color:#fff}
.item.loading .spk{animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.ru{font-weight:700;font-size:18px;line-height:1.3}
.uz{color:var(--muted);font-size:14px;margin-top:1px}
.who{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.who.Тимур{color:#e07a1c}.who.Малика{color:var(--purple)}.who.Ваня{color:var(--green)}.who.Барсик{color:var(--red)}
.para{font-size:18px;line-height:1.6}
.para .item{display:block;border:0;padding:8px 10px}
h3.rt{text-align:center;margin:2px 0 10px;font-size:21px}
nav.lessons{margin-top:18px}
nav.lessons h4{color:#fff;margin:0 0 8px;font-size:14px;letter-spacing:.5px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.82);border-radius:14px;padding:9px 10px;font-size:13px;font-weight:600}
.grid a span{flex:none;min-width:30px;height:30px;border-radius:9px;background:#3f5bd9;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.grid a.cur{outline:3px solid var(--gold)}
.speed{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--muted)}
.speed button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font-weight:700;cursor:pointer}
.speed button.on{background:#3f5bd9;color:#fff;border-color:#3f5bd9}
footer{color:rgba(255,255,255,.85);text-align:center;font-size:12px;margin-top:22px;line-height:1.6}
.warn{background:#fff3f3;border:1px solid #ffc9c9;color:#a33;border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px;display:none}
</style>
</head>

const DATA = {"10":{"num":"10","title":"Мои́ увлече́ния","titleUz":"Mening qiziqishlarim","words":[["футбо́л","futbol"],["баскетбо́л","basketbol"],["те́ннис","tennis"],["ша́хматы","shaxmat"],["гита́ра","gitara"],["пиани́но","pianino"],["рисова́ние","rasm chizish"],["пла́вание","suzish"],["компью́терные и́гры","kompyuter o'yinlari"],["блог","blog"],["фотогра́фия","fotografiya"],["кулина́рия","pazandachilik"]],"phrases":[["Я хочу́ в …","Men … ga (borishni) xohlayman"],["худо́жественная сту́дия","rassomlik studiyasi"],["мо́жет","balki"],["уме́ть","uddalamoq, bilmoq"],["Я не могу́!","Qila olmayman!"],["Э́то пра́вда!","Bu rost!"],["Я люблю́ рисова́ть.","Rasm chizishni yaxshi ko'raman."],["Я игра́ю на гита́ре.","Men gitara chalaman."],["Ты уме́ешь петь?","Qo'shiq ayta olasanmi?"],["Како́е у тебя́ хо́бби?","Hobbing nima?"]],"dialogue":{"title":"Диало́г «Что ты лю́бишь?»","intro":"Maktabda to'garaklar ro'yxati osildi. Do'stlar qaysi to'garakka yozilishni muhokama qilyapti.","lines":[["Тиму́р","Смотри́те! Футбо́л, ша́хматы, му́зыка… Я хочу́ в футбо́л!"],["Мали́ка","А я люблю́ рисова́ть. Я хочу́ в худо́жественную сту́дию."],["Ва́ня","А я игра́ю на гита́ре. Мо́жет, му́зыка? Ты уме́ешь петь, Тиму́р?"],["Тиму́р","Петь? Нет, я не могу́! Но я могу́ игра́ть в футбо́л пять часо́в!"],["Мали́ка","Ха-ха! Э́то пра́вда!"]]},"reading":{"title":"Ра́зные увлече́ния","text":["У Тиму́ра, Мали́ки и Ва́ни ра́зные увлече́ния.","Тиму́р — настоя́щий спортсме́н. Он игра́ет в футбо́л в шко́льной кома́нде. Ка́ждую суббо́ту у них игра́. Тиму́р хо́чет стать футболи́стом.","Мали́ка лю́бит рисова́ть. Она́ рису́ет лю́дей, живо́тных и го́род. У неё есть блог: там она́ пока́зывает свои́ рису́нки. У неё уже́ ты́сяча подпи́счиков!","Ва́ня игра́ет на гита́ре и лю́бит исто́рию. Он уме́ет игра́ть ру́сские и узбе́кские пе́сни. А ещё он мо́жет часа́ми чита́ть о ры́царях.","Но есть одно́ о́бщее увлече́ние: все тро́е лю́бят ша́хматы! Ка́ждую пя́тницу они́ игра́ют вме́сте."]}},"11":{"num":"11","title":"Мои́ пла́ны","titleUz":"Mening rejalarim","words":[["за́втра","ertaga"],["послеза́втра","indinga"],["ско́ро","tez orada"],["пото́м","keyin"],["у́читься","o'qimoq (ta'lim)"],["путеше́ствовать","sayohat qilmoq"],["отдыха́ть на мо́ре","dengizda dam olmoq"],["смотре́ть матч","o'yinni tomosha qilmoq"],["гото́виться к экза́мену","imtihonga tayyorlanmoq"],["занима́ться спо́ртом","sport bilan shug'ullanmoq"],["ходи́ть в бассе́йн","basseynga qatnamoq"],["изуча́ть англи́йский","ingliz tilini o'rganmoq"]],"phrases":[["Что ты бу́дешь де́лать?","Nima qilasan?"],["У нас матч!","Bizda o'yin bor!"],["вы́ставка","ko'rgazma"],["Дава́йте …","Keling, …"],["Отли́чная иде́я!","Ajoyib fikr!"],["Когда́?","Qachon?"],["Я бу́ду игра́ть.","Men o'ynayman."],["в суббо́ту","shanba kuni"],["за́втра","ertaga"],["Бу́дем смотре́ть фильм!","Film ko'ramiz!"]],"dialogue":{"title":"Диало́г «Что ты бу́дешь де́лать?»","intro":"Juma kuni, darsdan keyin. Do'stlar dam olish kunlari rejasini tuzyapti.","lines":[["Ва́ня","Что ты бу́дешь де́лать в суббо́ту, Тиму́р?"],["Тиму́р","У́тром я бу́ду игра́ть в футбо́л. У нас матч!"],["Мали́ка","А я бу́ду рисова́ть в па́рке. Там бу́дет вы́ставка."],["Ва́ня","А ве́чером? Дава́йте бу́дем смотре́ть фильм вме́сте!"],["Тиму́р","Отли́чная иде́я!"],["Ма́ма","А когда́ вы бу́дете де́лать уро́ки?"],["Все","В воскресе́нье!"]]},"reading":{"title":"Пла́ны на ле́то","text":["Ско́ро ле́то! У всех друзе́й больши́е пла́ны.","Тиму́р бу́дет в спорти́вном ла́гере. Там он бу́дет ка́ждый день игра́ть в футбо́л и пла́вать в бассе́йне. «Я бу́ду лу́чшим игроко́м!» — говори́т он.","Мали́ка бу́дет у ба́бушки в Бухаре́. Она́ бу́дет рисова́ть ста́рый го́род и снима́ть ви́део для бло́га.","А Ва́ня бу́дет путеше́ствовать. Снача́ла его́ семья́ полети́т в Москву́, а пото́м они́ бу́дут отдыха́ть на мо́ре.","В конце́ а́вгуста друзья́ сно́ва бу́дут вме́сте. Они́ бу́дут расска́зывать о ле́те и смотре́ть фо́то. Э́то бу́дет интере́сно!"]}},"12":{"num":"12","title":"День рожде́ния в суббо́ту!","titleUz":"Shanba kuni tug'ilgan kun!","words":[["пра́здник","bayram"],["пода́рок","sovg'a"],["торт","tort"],["све́чи","shamlar"],["ша́рики","sharlar"],["приглаше́ние","taklifnoma"],["гости́","mehmonlar"],["откры́тка","tabriknoma"],["покупа́ть / купи́ть","sotib olmoq"],["приглаша́ть / пригласи́ть","taklif qilmoq"],["гото́вить / пригото́вить","tayyorlamoq"],["поздравля́ть / поздра́вить","tabriklamoq"]],"phrases":[["Сде́лаем сюрпри́з?","Syurpriz qilamizmi?"],["Коне́чно!","Albatta!"],["Я куплю́","Men sotib olaman"],["Я приглашу́","Men taklif qilaman"],["кра́ски","bo'yoqlar"],["Я так сча́стлива!","Men juda baxtliman!"],["С днём рожде́ния!","Tug'ilgan kuning bilan!"],["Сюрпри́з!","Syurpriz!"],["Э́то тебе́ пода́рок.","Bu senga sovg'a."],["Жела́ю сча́стья!","Baxt tilayman!"]],"dialogue":{"title":"Диало́г «Сюрпри́з для Мали́ки»","intro":"Shanba kuni Malikaning tug'ilgan kuni. Timur va Vanya unga syurpriz tayyorlashmoqchi.","lines":[["Тиму́р","В суббо́ту у Мали́ки день рожде́ния. Сде́лаем сюрпри́з?"],["Ва́ня","Коне́чно! Я куплю́ ша́рики."],["Тиму́р","А я напишу́ приглаше́ния и приглашу́ друзе́й. Ба́бушка пригото́вит торт!"],["Ва́ня","А како́й пода́рок мы ку́пим?"],["Тиму́р","Мали́ка лю́бит рисова́ть. Ку́пим кра́ски!"],["Все","Сюрпри́з! С днём рожде́ния, Мали́ка!"],["Мали́ка","Ой! Спаси́бо! Я так сча́стлива!"]]},"reading":{"title":"Лу́чший день рожде́ния","text":["В суббо́ту у Мали́ки был день рожде́ния. Ей испо́лнилось трина́дцать лет.","У́тром Мали́ка ду́мала: «Наве́рное, никто́ не по́мнит…» Тиму́р и Ва́ня бы́ли на у́лице, а ма́ма — на ку́хне.","Но ве́чером Мали́ка откры́ла дверь — и уви́дела ша́рики, цветы́ и всех друзе́й! «Сюрпри́з!» — закрича́ли они́.","Ба́бушка пригото́вила большо́й торт. Друзья́ подари́ли Мали́ке кра́ски и альбо́м. А де́душка сде́лал фо́то на па́мять.","«Спаси́бо! Ско́ро я нарису́ю вас всех!» — сказа́ла Мали́ка. И пра́вда: че́рез неде́лю она́ нарисова́ла большу́ю карти́ну."]}},"01":{"num":"1","title":"Приве́т! Дава́й познако́мимся!","titleUz":"Salom! Keling, tanishamiz!","words":[["приве́т","salom"],["здра́вствуйте","assalomu alaykum"],["пока́","xayr"],["до свида́ния","xayr (hurmat bilan)"],["спаси́бо","rahmat"],["пожа́луйста","marhamat / iltimos"],["ма́льчик","o'g'il bola"],["де́вочка","qiz bola"],["учи́тельница","o'qituvchi (ayol)"],["друзья́","do'stlar"],["Росси́я","Rossiya"],["Узбекиста́н","O'zbekiston"]],"phrases":[["Как тебя́ зову́т?","Isming nima?"],["Меня́ зову́т …","Mening ismim …"],["О́чень прия́тно!","Tanishganimdan xursandman!"],["Отку́да ты?","Qayerdansan?"],["Я из …","Men … danman."],["Дава́й дружи́ть!","Keling, do'st bo'lamiz!"],["Как дела́?","Ishlar qalay?"],["Хорошо́, спаси́бо!","Yaxshi, rahmat!"],["А ты?","Sen-chi?"],["До за́втра!","Ertagacha!"]],"dialogue":{"title":"Диало́г «Но́вый учени́к»","intro":"Vanya yangi maktabga keldi. Uni sinf eshigi oldida o'qituvchi kutib oldi.","lines":[["Ва́ня","Здра́вствуйте!"],["Учи́тельница","Здра́вствуй! Как тебя́ зову́т?"],["Ва́ня","Меня́ зову́т Ва́ня."],["Учи́тельница","О́чень прия́тно! А отку́да ты?"],["Ва́ня","Я из Росси́и, из Москвы́."],["Тиму́р","Приве́т, Ва́ня! Я Тиму́р. Я из Узбекиста́на. Дава́й дружи́ть!"]]},"reading":{"title":"Но́вый друг","text":["Приве́т! Меня́ зову́т Ва́ня. Мне четы́рнадцать лет. Я из Росси́и, из Москвы́.","Сейча́с моя́ семья́ живёт в Самарка́нде. Мой па́па — инжене́р, он рабо́тает здесь.","Сего́дня я в но́вой шко́ле. Учи́тельницу зову́т О́льга Петро́вна. Она́ о́чень до́брая.","В кла́ссе я ви́жу ма́льчика. Его́ зову́т Тиму́р. Он из Узбекиста́на. Тиму́р говори́т: «Приве́т! Дава́й дружи́ть!»","Тепе́рь Тиму́р — мой друг. А его́ сестру́ зову́т Мали́ка. Она́ то́же о́чень весёлая!"]}},"02":{"num":"2","title":"Моя́ семья́","titleUz":"Mening oilam","words":[["ма́ма","ona"],["па́па","ota"],["брат","aka / uka"],["сестра́","opa / singil"],["ба́бушка","buvi"],["де́душка","bobo"],["врач","shifokor"],["учи́тель","o'qituvchi"],["инжене́р","muhandis"],["по́вар","oshpaz"],["води́тель","haydovchi"],["фото́граф","fotograf"]],"phrases":[["Смотри́!","Qara!"],["Кто э́то?","Bu kim?"],["Что э́то?","Bu nima?"],["на́ше семе́йное фо́то","bizning oilaviy suratimiz"],["са́мый вку́сный","eng mazali"],["то́же","ham"],["Кто он?","U kim?"],["Он врач.","U shifokor."],["моя́ семья́","mening oilam"],["член семьи́","oila a'zosi"]],"dialogue":{"title":"Диало́г «Семе́йное фо́то»","intro":"Vanya Timurlarnikiga mehmonga keldi. Malika unga oilaviy albomni ko'rsatyapti.","lines":[["Мали́ка","Ва́ня, смотри́! Э́то на́ше семе́йное фо́то."],["Ва́ня","Кто э́то?"],["Мали́ка","Э́то мой па́па. Он врач."],["Ва́ня","А кто э́то?"],["Мали́ка","Э́то моя́ ба́бушка. Она́ по́вар. Её плов — са́мый вку́сный!"],["Ва́ня","А что э́то?"],["Тиму́р","Э́то наш кот Ба́рсик! Он то́же член семьи́!"]]},"reading":{"title":"Семья́ Тиму́ра и Мали́ки","text":["Приве́т! Меня́ зову́т Тиму́р. Э́то моя́ семья́. Мы живём в Самарка́нде.","Мой па́па — врач. Его́ зову́т Акма́л. Он рабо́тает в больни́це. Моя́ ма́ма — учи́тельница. Её зову́т Ди́льноза.","Мали́ка — моя́ мла́дшая сестра́. Ей двена́дцать лет. Она́ лю́бит рисова́ть.","Ещё у нас есть ба́бушка и де́душка. Ба́бушка — о́чень хоро́ший по́вар. Де́душка — фото́граф. Э́то его́ фо́то!","А э́то Ба́рсик. Он наш кот. Он то́же член семьи́!"]}},"03":{"num":"3","title":"Мой класс","titleUz":"Mening sinfim","words":[["кни́га","kitob"],["ру́чка","ruchka"],["каранда́ш","qalam"],["тетра́дь","daftar"],["рюкза́к","ryukzak"],["лине́йка","chizg'ich"],["пена́л","penal"],["ла́стик","o'chirg'ich"],["компью́тер","kompyuter"],["матема́тика","matematika"],["исто́рия","tarix"],["физкульту́ра","jismoniy tarbiya"]],"phrases":[["Где …?","… qayerda?"],["Тут / вот","Bu yerda / mana"],["… нет","… yo'q"],["Не волну́йся!","Xavotir olma!"],["У меня́ есть …","Menda … bor"],["Вы — лу́чшие!","Sizlar eng zo'rsiz!"],["Дай, пожа́луйста, …","Iltimos, … ber"],["Спаси́бо, друзья́!","Rahmat, do'stlar!"],["Открыва́ем кни́ги!","Kitoblarni ochamiz!"],["люби́мый предме́т","sevimli fan"]],"dialogue":{"title":"Диало́г «Где мой пена́л?»","intro":"Ertalab dars boshlanyapti. Timur ryukzagini ochdi, lekin…","lines":[["Тиму́р","Ой! Где мой пена́л? Тут кни́ги, тетра́ди… а пена́ла нет!"],["Ва́ня","Не волну́йся! У меня́ есть ру́чки и карандаши́."],["Мали́ка","А у меня́ есть лине́йка и ла́стик. Вот, пожа́луйста!"],["Тиму́р","Спаси́бо, друзья́! Вы — лу́чшие!"],["Учи́тельница","Так, де́ти! Открыва́ем кни́ги!"]]},"reading":{"title":"Наш класс","text":["Э́то наш класс. Он большо́й и све́тлый. Тут три окна́, столы́ и сту́лья.","На стене́ — доска́ и ка́рта. На столе́ учи́тельницы — кни́ги, журна́лы и компью́тер.","В на́шем кла́ссе два́дцать пять ученико́в. Мы — хоро́шие друзья́.","Мой люби́мый предме́т — матема́тика. А Ва́ня лю́бит исто́рию, Мали́ка — рисова́ние.","У нас есть и интере́сные уро́ки: физкульту́ра и информа́тика. Там мы игра́ем и рабо́таем на компью́терах."]}},"04":{"num":"4","title":"Мой лу́чший друг","titleUz":"Eng yaqin do'stim","words":[["высо́кий","baland bo'yli"],["невысо́кая","past bo'yli (qiz)"],["весёлый","quvnoq"],["серьёзный","jiddiy"],["у́мная","aqlli (qiz)"],["до́брая","mehribon (qiz)"],["спорти́вный","sportchi"],["лени́вый","dangasa"],["дли́нные во́лосы","uzun soch"],["коро́ткие во́лосы","kalta soch"],["очки́","ko'zoynak"],["цвета́","ranglar"]],"phrases":[["о мои́х друзья́х","do'stlarim haqida"],["У него́ очки́","U ko'zoynak taqadi"],["ры́жие во́лосы","sariq-malla soch"],["иногда́","ba'zan"],["про́сто","shunchaki"],["уста́л","charchadim"],["Како́й он?","U qanaqa?"],["Он высо́кий.","U baland bo'yli."],["У неё дли́нные во́лосы.","Uning sochi uzun."],["Я не лени́вый!","Men dangasa emasman!"]],"dialogue":{"title":"Диало́г «Како́й он?»","intro":"Malika blogi uchun «Mening do'stlarim» degan video tayyorlayapti.","lines":[["Мали́ка","Приве́т, друзья́! Сего́дня мой блог — о мои́х друзья́х!"],["Мали́ка","Э́то Ва́ня. Он высо́кий и у́мный. У него́ очки́ и ры́жие во́лосы."],["Ва́ня","И я о́чень весёлый!"],["Мали́ка","А э́то мой брат Тиму́р. Он о́чень спорти́вный…"],["Мали́ка","…но иногда́ лени́вый!"],["Тиму́р","Что?! Я не лени́вый! Я про́сто уста́л!"]]},"reading":{"title":"Мой лу́чший друг","text":["Мой лу́чший друг — Ва́ня. Он из Москвы́, но сейча́с живёт в Самарка́нде.","Ва́ня высо́кий и худо́й. У него́ ры́жие во́лосы, голубы́е глаза́ и кру́глые очки́. Он всегда́ хо́дит в зелёной футбо́лке.","Ва́ня о́чень у́мный. Он лю́бит исто́рию и зна́ет всё о ры́царях и за́мках. А ещё он весёлый: его́ шу́тки — са́мые смешны́е!","Мы ра́зные: я спорти́вный, а он лю́бит кни́ги. Но мы всегда́ вме́сте. Хоро́ший друг — э́то большо́е сча́стье!"]}},"05":{"num":"5","title":"Чи́сла и во́зраст","titleUz":"Sonlar va yosh","words":[["оди́н","1 — bir"],["два","2 — ikki"],["три","3 — uch"],["четы́ре","4 — to'rt"],["пять","5 — besh"],["шесть","6 — olti"],["семь","7 — yetti"],["во́семь","8 — sakkiz"],["де́вять","9 — to'qqiz"],["де́сять","10 — o'n"],["сто","100 — yuz"],["ноль","0 — nol"]],"phrases":[["Ско́лько тебе́ лет?","Necha yoshdasan?"],["Мне … лет.","Men … yoshdaman."],["Ско́лько сто́ит?","Qancha turadi?"],["до́рого / дёшево","qimmat / arzon"],["Берём!","Olamiz!"],["пода́рок","sovg'a"],["Кото́рый час?","Soat necha?"],["Э́то тебе́!","Bu senga!"],["О́чень краси́вая!","Juda chiroyli!"],["С днём рожде́ния!","Tug'ilgan kuning bilan!"]],"dialogue":{"title":"Диало́г «Ско́лько тебе́ лет?»","intro":"Shanba kuni do'stlar bozorga — Vanya uchun sovg'a olishga borishdi. Ertaga uning tug'ilgan kuni!","lines":[["Мали́ка","Ва́ня, ско́лько тебе́ лет?"],["Ва́ня","Мне четы́рнадцать. А за́втра — пятна́дцать!"],["Тиму́р","Здра́вствуйте! Ско́лько сто́ит э́тот мяч?"],["Продаве́ц","Сто пятьдеся́т ты́сяч сум."],["Тиму́р","Ой, до́рого! А э́та ке́пка?"],["Продаве́ц","Шестьдеся́т ты́сяч."],["Мали́ка","Отли́чно! Берём! Ва́ня, э́то тебе́ пода́рок!"],["Ва́ня","Спаси́бо! О́чень краси́вая!"]]},"reading":{"title":"Мой день рожде́ния","text":["Приве́т! Меня́ зову́т Ва́ня. Сего́дня мой день рожде́ния. Мне пятна́дцать лет!","У́тром ма́ма говори́т: «С днём рожде́ния, сыно́к!» Па́па да́рит мне но́вый телефо́н. Его́ но́мер: де́вять, де́вять, во́семь…","В три часа́ прихо́дят друзья́: Тиму́р, Мали́ка и ещё пять ребя́т. Нас де́вять челове́к!","Тиму́р и Мали́ка да́рят мне кра́сную ке́пку. Она́ сто́ила шестьдеся́т ты́сяч сум. Ба́бушка Тиму́ра гото́вит торт. На то́рте пятна́дцать свече́й!","Э́то лу́чший день рожде́ния!"]}},"06":{"num":"6","title":"Вчера́ бы́ло интере́сно","titleUz":"Kecha qiziq bo'ldi","words":[["игра́ть в футбо́л","futbol o'ynamoq"],["смотре́ть фильм","film ko'rmoq"],["чита́ть кни́гу","kitob o'qimoq"],["слу́шать му́зыку","musiqa tinglamoq"],["рисова́ть","rasm chizmoq"],["гуля́ть в па́рке","parkda sayr qilmoq"],["звони́ть дру́гу","do'stga qo'ng'iroq qilmoq"],["гото́вить","ovqat tayyorlamoq"],["убира́ть ко́мнату","xonani yig'ishtirmoq"],["отдыха́ть","dam olmoq"],["де́лать уро́ки","dars tayyorlamoq"],["быть в музе́е","muzeyda bo'lmoq"]],"phrases":[["Где ты был?","Qayerda eding?"],["Я звони́л тебе́.","Senga qo'ng'iroq qildim."],["Мы вы́играли!","Biz yutdik!"],["Бы́ло интере́сно.","Qiziq bo'ldi."],["весь день","kun bo'yi"],["ску́чно","zerikarli"],["Что ты де́лал вчера́?","Kecha nima qilding?"],["Я был до́ма.","Men uyda edim."],["Бе́дный Ва́ня!","Bechora Vanya!"],["Бы́ло ве́село!","Quvnoq bo'ldi!"]],"dialogue":{"title":"Диало́г «Что ты де́лал вчера́?»","intro":"Dushanba kuni ertalab. Do'stlar maktab hovlisida dam olish kunlari haqida gaplashyapti.","lines":[["Ва́ня","Тиму́р, где ты был вчера́? Я звони́л тебе́!"],["Тиму́р","Вчера́ я был на стадио́не. Мы игра́ли в футбо́л. Мы вы́играли!"],["Мали́ка","А я была́ в музе́е. Там бы́ло о́чень интере́сно! А что ты де́лал, Ва́ня?"],["Ва́ня","Я весь день убира́л ко́мнату… Бы́ло ску́чно!"],["Тиму́р","Ха-ха! Бе́дный Ва́ня!"]]},"reading":{"title":"Суббо́та в Самарка́нде","text":["В суббо́ту бы́ло со́лнечно и тепло́. Тиму́р, Мали́ка и Ва́ня гуля́ли по Самарка́нду.","Снача́ла они́ бы́ли на Региста́не. Ва́ня фотографи́ровал, а Мали́ка рисова́ла ме́дресе в своём альбо́ме.","Пото́м друзья́ бы́ли в музе́е. Там гид расска́зывал об исто́рии Самарка́нда. Ва́ня слу́шал о́чень внима́тельно: он лю́бит исто́рию.","Днём они́ обе́дали в кафе́. Тиму́р ел са́мсу, а Ва́ня пил зелёный чай.","Ве́чером Ва́ня звони́л ба́бушке в Москву́. «Ба́бушка, сего́дня бы́ло о́чень интере́сно!» — говори́л он."]}},"07":{"num":"7","title":"Кани́кулы","titleUz":"Ta'til","words":[["зима́","qish"],["весна́","bahor"],["ле́то","yoz"],["о́сень","kuz"],["со́лнце","quyosh"],["дождь","yomg'ir"],["снег","qor"],["ве́тер","shamol"],["мо́ре","dengiz"],["го́ры","tog'lar"],["по́езд","poyezd"],["самолёт","samolyot"]],"phrases":[["е́здить / лета́ть","(mashinada) bormoq / uchib bormoq"],["пешко́м","piyoda"],["тру́дно","qiyin"],["краси́во","chiroyli"],["у ба́бушки","buvimnikida"],["шёл дождь","yomg'ir yog'di"],["Где ты был ле́том?","Yozda qayerda bo'lding?"],["Бы́ло жа́рко.","Issiq edi."],["Я лета́л в Москву́.","Moskvaga uchib bordim."],["Я не смог.","Qila olmadim."]],"dialogue":{"title":"Диало́г «Где ты был ле́том?»","intro":"Sentabr. Yangi o'quv yilining birinchi kuni. Do'stlar yozgi ta'til haqida gaplashyapti.","lines":[["Ва́ня","Приве́т! Где вы бы́ли ле́том?"],["Тиму́р","Мы е́здили в го́ры, в Чимга́н!"],["Тиму́р","Мы шли пешко́м пять часо́в! Бы́ло тру́дно, но о́чень краси́во."],["Мали́ка","А я была́ у ба́бушки в Бухаре́. Там бы́ло о́чень жа́рко — со́рок гра́дусов!"],["Ва́ня","А я лета́л в Москву́. Там шёл дождь! Я хоте́л на мо́ре, но не смог…"]]},"reading":{"title":"Письмо́ из Москвы́","text":["Приве́т, Тиму́р! Э́то Ва́ня. Пишу́ тебе́ из Москвы́. Я здесь у ба́бушки.","Ле́то в Москве́ не тако́е, как в Самарка́нде. Вчера́ шёл дождь, и бы́ло хо́лодно — то́лько пятна́дцать гра́дусов!","Но я не скуча́л. Мы с ба́бушкой бы́ли в Третьяко́вской галере́е. Пото́м мы шли пешко́м по Арба́ту и е́ли мороже́ное.","А в воскресе́нье свети́ло со́лнце. Я был в па́рке Го́рького и ката́лся на велосипе́де.","Я хоте́л пое́хать на мо́ре, но не смог: биле́ты бы́ли о́чень дороги́е. Ничего́! Ско́ро уви́димся! Твой друг Ва́ня."]}},"08":{"num":"8","title":"Что ты де́лаешь?","titleUz":"Nima qilyapsan?","words":[["чита́ть","o'qimoq"],["писа́ть","yozmoq"],["игра́ть","o'ynamoq"],["слу́шать","tinglamoq"],["де́лать","qilmoq"],["знать","bilmoq"],["понима́ть","tushunmoq"],["отвеча́ть","javob bermoq"],["рабо́тать","ishlamoq"],["гуля́ть","sayr qilmoq"],["отдыха́ть","dam olmoq"],["петь","kuylamoq"]],"phrases":[["Что ты де́лаешь?","Nima qilyapsan?"],["кни́га о ры́царях","ritsarlar haqidagi kitob"],["Слы́шишь?","Eshityapsanmi?"],["Обе́д гото́в!","Tushlik tayyor!"],["Мы ждём!","Kutyapmiz!"],["обе́дать","tushlik qilmoq"],["сейча́с","hozir"],["Я чита́ю кни́гу.","Men kitob o'qiyapman."],["Мы обе́даем!","Tushlik qilyapmiz!"],["О́чень интере́сно!","Juda qiziq!"]],"dialogue":{"title":"Диало́г «Что вы де́лаете?»","intro":"Yakshanba kuni. Vanya Timurga video-qo'ng'iroq qildi.","lines":[["Ва́ня","Приве́т, Тиму́р! Что ты де́лаешь?"],["Тиму́р","Я игра́ю в компью́тер. А ты?"],["Ва́ня","А я чита́ю кни́гу о ры́царях. О́чень интере́сно!"],["Тиму́р","А Мали́ка сейча́с поёт и танцу́ет. Слы́шишь?"],["Мали́ка","Ля-ля-ля!"],["Ба́бушка","Де́ти! Обе́д гото́в! Мы ждём!"],["Тиму́р","Ва́ня, пока́! Мы обе́даем!"]]},"reading":{"title":"Воскресе́нье до́ма","text":["Сего́дня воскресе́нье. Вся семья́ до́ма.","Па́па чита́ет газе́ту и пьёт чай. Ма́ма гото́вит обе́д на ку́хне. Ба́бушка помога́ет ей.","Де́душка сиди́т в саду́ и фотографи́рует цветы́. Он о́чень лю́бит фотогра́фию.","Мали́ка рису́ет в свое́й ко́мнате и слу́шает му́зыку. Иногда́ она́ поёт.","А Тиму́р? Обы́чно в воскресе́нье он игра́ет в футбо́л. Но сего́дня идёт дождь. Поэ́тому он игра́ет в компью́тер и ждёт обе́д.","А Ба́рсик? Ба́рсик спит. Он всегда́ спит!"]}},"k1":{"num":"К1","title":"Ру́сский алфави́т","titleUz":"Rus alifbosi","words":[["Аа — арбу́з","tarvuz","а. арбу́з."],["Бб — бана́н","banan","бэ. бана́н."],["Вв — волк","bo'ri","вэ. волк."],["Гг — гита́ра","gitara","гэ. гита́ра."],["Дд — дом","uy","дэ. дом."],["Ее — ель","archa","е. ель."],["Ёё — ёжик","tipratikan","ё. ёжик."],["Жж — жира́ф","jirafa","жэ. жира́ф."],["Зз — зо́нтик","soyabon","зэ. зо́нтик."],["Ии — индю́к","kurk [["","Дзынь-дзынь! Дзынь-дзынь!"],["Ва́ня","Тиму́р, приве́т! Ты где? Мы игра́ем в футбо́л в де́сять часо́в!"],["Тиму́р","М-м-м… Ва́ня? Ско́лько сейча́с вре́мени?"],["Ва́ня","Уже́ де́сять часо́в! Ты спишь?!"],["Тиму́р","Ой! Я опа́здываю! Ба́рсик, извини́!"],["Мали́ка","Тиму́р, сего́дня суббо́та! Ты всегда́ спишь до обе́да!"],["Тиму́р","То́лько не сего́дня! Я бегу́!"],["Ба́рсик","Мя-я-у!"]]},"reading":{"title":"День Мали́ки","text":["Приве́т! Меня́ зову́т Мали́ка, мне двена́дцать лет. Я живу́ в Самарка́нде.","Я встаю́ в семь часо́в. Я умыва́юсь, чи́щу зу́бы и одева́юсь. Пото́м мы с бра́том за́втракаем. Ма́ма гото́вит вку́сную ка́шу.","У́тром мы идём в шко́лу пешко́м. В шко́ле я люблю́ рисова́ние и ру́сский язы́к. Я обе́даю до́ма в два часа́.","По́сле обе́да я де́лаю уро́ки, а пото́м рису́ю. Ве́чером я снима́ю коро́ткие ви́део для моего́ бло́га. Мой брат Тиму́р в э́то вре́мя игра́ет в футбо́л.","В семь часо́в вся семья́ у́жинает. Мы говори́м о на́шем дне.","Я ложу́сь спать в де́сять часо́в. А Тиму́р? Он ложи́тся по́здно, поэ́тому у́тром до́лго спит!"]}},"p1":{"num":"П1","title":"Повторе́ние 1","titleUz":"Takrorlash: 1–5-darslar","reading":{"title":"Но́вая учени́ца","text":["В на́шем кла́ссе но́вая учени́ца. Её зову́т Ле́на. Ей трина́дцать лет. Она́ из Казахста́на, из Алма́ты.","Ле́на невысо́кая. У неё дли́нные све́тлые во́лосы и зелёные глаза́. Она́ о́чень весёлая и у́мная.","У Ле́ны больша́я семья́: па́па, ма́ма, два бра́та и ба́бушка. Па́па — инжене́р, ма́ма — врач.","Её люби́мый предме́т — матема́тика. А ещё она́ игра́ет в волейбо́л. Тепе́рь Ле́на — на́ша подру́га!"]}},"p2":{"num":"П2","title":"Повторе́ние 2","titleUz":"Takrorlash: 6–12-darslar","reading":{"title":"Дневни́к Ва́ни","text":["Вчера́ был тру́дный день. У́тром я опозда́л в шко́лу, потому́ что до́лго спал. На уро́ке матема́тики я не мог реши́ть зада́чу.","Сего́дня всё хорошо́. Я встаю́ ра́но, де́лаю заря́дку и за́втракаю. Сейча́с я сижу́ в па́рке и пишу́ э́тот дневни́к. Тиму́р игра́ет в футбо́л, а Мали́ка const $ = (s) => document.querySelector(s);
const clean = (t) => t.replace(/\u0301/g, "").replace(/\[[^\]]*\]/g, "").replace(/\u2014/g, ",").replace(/\s+/g, " ").trim();
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function lessonId() {
  const q = new URLSearchParams(location.search).get("id");
  if (q) return q.toLowerCase();
  const seg = location.pathname.replace(/\/+$/, "").split("/").pop().toLowerCase();
  return DATA[seg] ? seg : null;
}

// ---- TTS ----
let ruVoice = null, rate = 0.85, queue = [], playingEl = null, stopFlag = false;
function pickVoice() { const v = speechSynthesis.getVoices(); ruVoice = v.find((x) => /ru(-|_)RU/i.test(x.lang)) || v.find((x) => /^ru/i.test(x.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let curAudio = null, serverTTS = true;
const RATE_MAP = { 0.7: 0.8, 0.85: 0.9, 1: 1 };
function mark(el) { if (playingEl) playingEl.classList.remove("playing"); if (el) { el.classList.add("playing"); playingEl = el; } }
function browserSpeak(text, el) {
  return new Promise((res) => {
    if (!("speechSynthesis" in window)) { $("#warn") && ($("#warn").style.display = "block"); return res(); }
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = "ru-RU"; u.rate = rate; if (ruVoice) u.voice = ruVoice;
    mark(el);
    u.onend = u.onerror = () => { el && el.classList.remove("playing"); res(); };
    speechSynthesis.speak(u);
  });
}
function speak(text, el) {
  if (!serverTTS) return browserSpeak(text, el);
  return new Promise((res) => {
    mark(el); if (el) el.classList.add("loading");
    const a = new Audio("/api/kitob1-tts?t=" + encodeURIComponent(clean(text)));
    curAudio = a; a.playbackRate = RATE_MAP[rate] || 1;
    let done = false; const fin = () => { if (done) return; done = true; el && el.classList.remove("playing", "loading"); res(); };
    a.onended = fin;
    a.onerror = () => { if (done) return; done = true; serverTTS = false; el && el.classList.remove("loading"); browserSpeak(text, el).then(res); };
    a.onplaying = () => el && el.classList.remove("loading");
    a.play().catch(() => { if (!done) { done = true; el && el.classList.remove("loading"); browserSpeak(text, el).then(res); } });
  });
}
function stopAll() { stopFlag = true; if (curAudio) { curAudio.pause(); curAudio = null; } if ("speechSynthesis" in window) speechSynthesis.cancel(); document.querySelectorAll(".playing,.loading").forEach((e) => e.classList.remove("playing", "loading")); const b = $("#playall"); if (b) { b.textContent = "▶ Hammasini tinglash"; b.classList.remove("stop"); } }
async function playAll(btn) {
  if (btn.classList.contains("stop")) return stopAll();
  stopAll(); stopFlag = false; btn.textContent = "■ To'xtatish"; btn.classList.add("stop");
  for (const el of document.querySelectorAll("#panel .item")) { if (stopFlag) break; el.scrollIntoView({ block: "center", behavior: "smooth" }); await speak(el.dataset.say, el); await new Promise((r) => setTimeout(r, 350)); }
  stopAll();
}

    <div class="speed">Tezlik <button data-r="0.7">0.7</button><button data-r="0.85" class="on">0.85</button><button data-r="1">1×</button></div></div>

}
function tryRecorded(id, part) {
  const url = `${AUDIO_BASE}/${id}/${part}.mp3`;
  const a = new Audio(); a.preload = "metadata";
  a.onloadedmetadata = () => { const r = $("#rec"); if (r) r.innerHTML = `<div class="player"><span class="note" style="flex:none">🎧 O'qituvchi ovozi:</span><audio controls src="${url}"></audio></div>`; };
  a.src = url;
}
function render(part) {
  stopAll();
  const L = DATA[cur]; const P = $("#panel");
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.p === part));
  let html = "";
  if (part === "sozlar" || part === "iboralar") {
    const list = part === "sozlar" ? L.words : L.phrases;
    html += `<h2>${part === "sozlar" ? "Но́вые слова́" : "Поле́зные фра́зы"}</h2><p class="hint">${part === "sozlar" ? "Yangi so'zlar" : "Foydali iboralar"} · bosing va tinglang, keyin takrorlang</p>` + audioBlock(cur, part);
    html += list.map(([ru, uz, say]) => `<div class="item" data-say="${esc(say || ru)}"><div class="spk">🔊</div><div><div class="ru">${esc(ru)}</div><div class="uz">${esc(uz)}</div></div></div>`).join("");
  } else if (part === "dialog") {
    const d = L.dialogue;
    html += `<h2>${esc(d.title)}</h2><p class="hint">${esc(d.intro)}</p>` + audioBlock(cur, part);
    html += d.lines.map(([w, t]) => `<div class="item" data-say="${esc(t)}"><div class="spk">🔊</div><div>${w ? `<div class="who ${clean(w)}">${esc(w)}</div>` : ""}<div class="ru">${esc(t)}</div></div></div>`).join("");
  } else {
    const r = L.reading;
    html += `<h2>Чита́ем</h2><p class="hint">O'qiymiz · avval tinglang, keyin o'zingiz ovoz chiqarib o'qing</p>` + audioBlock(cur, part);
    html += `<h3 class="rt">${esc(r.title)}</h3><div class="para">` + r.text.map((t) => `<div class="item" data-say="${esc(t)}">${esc(t)}</div>`).join("") + "</div>";
  }
  P.innerHTML = html;
  P.querySelectorAll(".item").forEach((el) => (el.onclick = () => { stopAll(); speak(el.dataset.say, el); }));
  P.querySelectorAll(".speed button").forEach((b) => (b.onclick = () => { rate = +b.dataset.r; P.querySelectorAll(".speed button").forEach((x) => x.classList.toggle("on", x === b)); }));
  tryRecorded(cur, part);
  history.replaceState(null, "", "#" + part);
}
function renderIndex() {
  $("#hero").innerHTML = `<div class="badge">1<small>KITOB</small></div><div><h1>Говори́м по-ру́сски!</h1><p>Darsni tanlang va tinglang</p></div>`;
  $("#tabs").style.display = "none"; $("#panel").style.display = "none";
}
function init() {
  cur = lessonId();
  $("#grid").innerHTML = ORDER.map((k) => `<a href="/kitob1/${k}" class="${k === cur ? "cur" : ""}"><span>${esc(DATA[k].num)}</span>${esc(DATA[k].title.replace(/́/g, ""))}</a>`).join("");
  if (!cur) return renderIndex();
  const L = DATA[cur];
  document.title = `${L.title.replace(/́/g, "")} · Kitob 1 · Akademiya Pushkina`;
  const small = /^p/.test(cur) ? "ПОВТОР." : /^k/.test(cur) ? "ВВОДНЫЙ" : "УРОК";
  $("#hero").innerHTML = `<div class="badge">${esc(L.num)}<small>${small}</small></div><div><h1>${esc(L.title)}</h1><p>${esc(L.titleUz)}</p></div>`;
  const avail = SECTIONS.filter(([, , g]) => { const v = g(L); return v && (Array.isArray(v) ? v.length : true); });
  $("#tabs").innerHTML = avail.map(([p, t]) => `<button class="tab" data-p="${p}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => render(t.dataset.p)));
  const want = location.hash.slice(1);
  render(avail.some(([p]) => p === want) ? want : avail[0][0]);
}
init();
</script>
