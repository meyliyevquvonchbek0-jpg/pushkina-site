<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Говорим по-русски! · Kitob 2 · Akademiya Pushkina</title>
<meta name="theme-color" content="#3b2a7a">
<style>
:root{--ink:#1d1b3a;--muted:#6b6790;--card:rgba(255,255,255,.86);--line:rgba(60,40,140,.12);--accent:#ff8a3d;--gold:#ffc94d;--blue:#3f5bd9;--green:#18a77a;--red:#e5484d;--purple:#7c4ddb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);
  background:linear-gradient(170deg,#2d2470 0%,#5b3a8c 38%,#b8628a 72%,#f4a77a 100%) fixed;padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 0}
header.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
header.top .logo{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex:none}
header.top .t{font-size:13px;line-height:1.25;opacity:.95}
header.top .t b{display:block;font-size:15px;letter-spacing:1px;color:var(--gold)}
.hero{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(20,10,60,.25)}
.badge{flex:none;width:64px;height:76px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#3f5bd9,#2b3fa8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;box-shadow:0 6px 14px rgba(40,60,170,.35)}
.badge small{font-size:10px;letter-spacing:1.5px;font-weight:700;opacity:.9}
.hero h1{margin:0;font-size:24px;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--accent);font-style:italic;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 12px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
.tab.on{background:#fff;color:#3b2a7a;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(20,10,60,.2)}
.card h2{margin:0 0 4px;font-size:19px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:linear-gradient(135deg,#fff4e6,#ffe7d1);border:1px solid #ffd2a8;border-radius:16px;padding:10px 12px;margin-bottom:12px}
.player audio{width:100%;height:38px}
.playall{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;padding:10px 16px;font-size:14px;cursor:pointer;flex:none;box-shadow:0 4px 10px rgba(255,138,61,.35)}
.playall.stop{background:var(--red)}
.note{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px;transition:background .15s}
.item:last-child{border-bottom:0}
.item:active,.item.playing{background:rgba(255,201,77,.28)}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:#eef1ff;color:var(--blue);display:grid;place-items:center;font-size:17px}
.item.playing .spk{background:var(--accent);color:#fff}
.item.loading .spk{animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.ru{font-weight:700;font-size:18px;line-height:1.3}
.uz{color:var(--muted);font-size:14px;margin-top:1px}
.who{font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.who.Тимур{color:#e07a1c}.who.Малика{color:var(--purple)}.who.Ваня{color:var(--green)}.who.Барсик{color:var(--red)}
.para{font-size:18px;line-height:1.6}
.para .item{display:block;border:0;padding:8px 10px}
h3.rt{text-align:center;margin:2px 0 10px;font-size:21px}
nav.lessons{margin-top:18px}
nav.lessons h4{color:#fff;margin:0 0 8px;font-size:14px;letter-spacing:.5px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.82);border-radius:14px;padding:9px 10px;font-size:13px;font-weight:600}
.grid a span{flex:none;min-width:30px;height:30px;border-radius:9px;background:#3f5bd9;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.grid a.cur{outline:3px solid var(--gold)}
.speed{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--muted)}
.speed button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font-weight:700;cursor:pointer}
.speed button.on{background:#3f5bd9;color:#fff;border-color:#3f5bd9}
footer{color:rgba(255,255,255,.85);text-align:center;font-size:12px;margin-top:22px;line-height:1.6}
.warn{background:#fff3f3;border:1px solid #ffc9c9;color:#a33;border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px;display:none}
</style>
</head>

const DATA = {"13":{"num":"13","title":"Мой дом","titleUz":"Mening uyim","words":[["дом","uy"],["кварти́ра","kvartira"],["ко́мната","xona"],["ку́хня","oshxona"],["ва́нная","vannaxona"],["спа́льня","yotoqxona"],["балко́н","balkon"],["стол","stol"],["стул","stul"],["крова́ть","karavot"],["шкаф","shkaf"],["дива́н","divan"]],"phrases":[["Проходи́те!","Kiringlar!"],["на́ша кварти́ра","bizning kvartiramiz"],["Кака́я больша́я!","Qanday katta!"],["Вот моя́ ко́мната.","Mana mening xonam."],["Где твой компью́тер?","Kompyuteringiz qayerda?"],["на столе́","stol ustida"],["в шкафу́","shkafda"],["Он живёт здесь.","U shu yerda yashaydi."],["Нельзя́!","Mumkin emas!"],["Твоё ме́сто","Sening joying"]],"dialogue":{"title":"Диало́г «Но́вая кварти́ра»","intro":"Vanyaning oilasi Samarqandda yangi kvartiraga ko'chdi. Timur va Malika mehmonga kelishdi.","lines":[["Ва́ня","Приве́т! Проходи́те! Э́то на́ша но́вая кварти́ра."],["Мали́ка","Кака́я больша́я!"],["Ва́ня","Вот моя́ ко́мната. Здесь крова́ть, стол и шкаф."],["Тиму́р","А где твой компью́тер?"],["Ва́ня","На столе́."],["Мали́ка","Ой! А кто там, в шкафу́?!"],["Ва́ня","Э́то Ха́ки, мой щено́к! Он то́же живёт здесь."],["Тиму́р","Смотри́! Ха́ки уже́ на крова́ти!"],["Ва́ня","Ха́ки, нельзя́! Твоё ме́сто в коридо́ре!"]]},"reading":{"title":"Но́вая кварти́ра Ва́ни","text":["Ва́ня и его́ семья́ тепе́рь живу́т в Самарка́нде. Ра́ньше они́ жи́ли в Москве́.","Их но́вая кварти́ра больша́я и све́тлая. В кварти́ре три ко́мнаты, ку́хня, ва́нная и балко́н.","Ма́ма о́чень лю́бит ку́хню. На ку́хне большо́й стол. Ве́чером вся семья́ у́жинает там.","Па́па лю́бит балко́н. На балко́не цветы́, и па́па там чита́ет газе́ту.","Ко́мната Ва́ни ма́ленькая, но ую́тная. В ко́мнате крова́ть, стол, стул и шкаф. На столе́ компью́тер и кни́ги.","А где живёт Ха́ки? Его́ ко́врик в коридо́ре. Но но́чью он ча́сто спит на крова́ти Ва́ни!"]}},"14":{"num":"14","title":"Мой го́род","titleUz":"Mening shahrim","words":[["у́лица","ko'cha"],["пло́щадь","maydon"],["парк","bog', park"],["музе́й","muzey"],["магази́н","do'kon"],["ры́нок","bozor"],["больни́ца","kasalxona"],["апте́ка","dorixona"],["банк","bank"],["авто́бус","avtobus"],["такси́","taksi"],["светофо́р","svetofor"]],"phrases":[["Извини́те, …","Kechirasiz, …"],["Где нахо́дится …?","… qayerda joylashgan?"],["Э́то недалеко́.","Bu uzoq emas."],["Иди́те пря́мо.","To'g'riga yuring."],["Пото́м напра́во.","Keyin o'ngga."],["Большо́е спаси́бо!","Katta rahmat!"],["Что ты здесь де́лаешь?","Bu yerda nima qilyapsan?"],["Я ищу́ …","Men … qidiryapman."],["Пойдём вме́сте!","Birga ketamiz!"],["За мной!","Orqamdan!"]],"dialogue":{"title":"Диало́г «Как пройти́ к Региста́ну?»","intro":"Vanya Samarqandni hali yaxshi bilmaydi. Bugun u Haki bilan sayrga chiqdi va adashib qoldi.","lines":[["Ва́ня","Извини́те, где нахо́дится Региста́н?"],["Же́нщина","Региста́н? Э́то недалеко́. Иди́те пря́мо."],["Же́нщина","Пото́м напра́во. Там пло́щадь и Региста́н."],["Ва́ня","Большо́е спаси́бо!"],["Тиму́р","Ва́ня! Приве́т! Что ты здесь де́лаешь?"],["Ва́ня","Я гуля́ю. Я ищу́ Региста́н."],["Тиму́р","Пойдём вме́сте! А пото́м домо́й на авто́бусе."],["Ва́ня","Отли́чно! Ха́ки, за мной!"]]},"reading":{"title":"Ва́ня пи́шет дру́гу в Москву́","text":["Приве́т, Ди́ма! Как дела́? Я живу́ в Самарка́нде уже́ ме́сяц.","Самарка́нд — о́чень краси́вый и ста́рый го́род. В це́нтре го́рода нахо́дится пло́щадь Региста́н. Там три ста́рые медресе́. Ве́чером на пло́щади о́чень краси́во!","Мой дом нахо́дится на у́лице Навои́. Ря́дом с до́мом большо́й парк. Ка́ждое у́тро я гуля́ю там с Ха́ки.","Шко́ла недалеко́, я хожу́ туда́ пешко́м. А в це́нтр мы е́здим на авто́бусе.","Мой друг Тиму́р показа́л мне ры́нок Сиа́б. Там о́чень мно́го фру́ктов, лепёшки и сла́дости!","Приезжа́й в го́сти! Твой друг Ва́ня."]}},"15":{"num":"15","title":"О чём ты ду́маешь?","titleUz":"Nima haqida o'ylayapsan?","words":[["фильм","film"],["мультфи́льм","multfilm"],["кни́га","kitob"],["ска́зка","ertak"],["пе́сня","qo'shiq"],["мечта́","orzu"],["косми́ческий кора́бль","kosmik kema"],["геро́й","qahramon"],["приро́да","tabiat"],["мо́ре","dengiz"],["живо́тные","hayvonlar"],["путеше́ствие","sayohat"]],"phrases":[["Дава́йте посмо́трим …","Keling, ko'ramiz …"],["О чём он?","U nima haqida?"],["о соба́ке","it haqida"],["Она́ и́щет …","U … qidiryapti"],["Как о Ха́ки!","Xuddi Haki haqidagidek!"],["фильм о ко́смосе","koinot haqida film"],["то́лько","faqat"],["Ты всегда́ говори́шь …","Sen doim … gapirasan"],["о еде́","ovqat haqida"],["Он ест мой попко́рн!","U popkornimni yeyapti!"]],"dialogue":{"title":"Диало́г «О чём фильм?»","intro":"Shanba kuni kechqurun. Bolalar Timurlarning uyida film tanlashyapti.","lines":[["Мали́ка","Дава́йте посмо́трим фильм! Вот но́вый мультфи́льм."],["Тиму́р","А о чём он?"],["Мали́ка","О соба́ке. Она́ и́щет свой дом."],["Ва́ня","О соба́ке? Как о Ха́ки!"],["Тиму́р","А я хочу́ фильм о ко́смосе и о раке́тах!"],["Мали́ка","Ты всегда́ говори́шь то́лько о ко́смосе!"],["Ва́ня","Тиму́р, ты ду́маешь о ко́смосе, а Ха́ки ду́мает о еде́!"],["Тиму́р","Ха-ха! Он ест мой попко́рн!"]]},"reading":{"title":"Мечты́ мои́х друзе́й","text":["Меня́ зову́т Мали́ка. Я веду́ блог «Мечты́». Сего́дня я спроси́ла друзе́й: «О чём ты мечта́ешь?»","Тиму́р мечта́ет о ко́смосе. Он хо́чет полете́ть на Марс. Он мно́го чита́ет о раке́тах и о плане́тах.","Ва́ня мечта́ет о путеше́ствии. Он хо́чет уви́деть мо́ре, го́ры и пусты́ню. Он ча́сто расска́зывает о Москве́ и о свое́й ба́бушке.","А я мечта́ю о профе́ссии худо́жника. Я хочу́ рисова́ть кни́ги для дете́й — ска́зки о живо́тных.","А о чём мечта́ет Ха́ки? Я ду́маю, о большо́й ко́сти!","А вы? О чём вы мечта́ете? Напиши́те в коммента́риях!"]}},"16":{"num":"16","title":"В магази́не и в кафе́","titleUz":"Do'konda va kafeda","words":[["хлеб","non"],["молоко́","sut"],["сыр","pishloq"],["я́йца","tuxumlar"],["я́блоко","olma"],["сок","sharbat"],["вода́","suv"],["чай","choy"],["суп","sho'rva"],["сала́т","salat"],["пи́цца","pitsa"],["моро́женое","muzqaymoq"]],"phrases":[["Вот меню́.","Mana menyu."],["Что вы бу́дете?","Nima olasiz?"],["Мне, пожа́луйста, …","Menga, iltimos, …"],["А мне …","Menga esa …"],["Я хочу́ …","Men … xohlayman"],["на десе́рт","desertga"],["шокола́дное","shokoladli"],["Счёт, пожа́луйста!","Hisobni bering!"],["Ско́лько сто́ит?","Qancha turadi?"],["ты́сяча сум","ming so'm"]],"dialogue":{"title":"Диало́г «В кафе́»","intro":"Maktabdan keyin Timur, Malika va Vanya kafega kirishdi.","lines":[["Официа́нт","Здра́вствуйте! Вот меню́. Что вы бу́дете?"],["Тиму́р","Мне, пожа́луйста, пи́ццу и сок."],["Мали́ка","А мне сала́т и минера́льную во́ду."],["Ва́ня","А я хочу́ суп и чёрный чай."],["Официа́нт","Хорошо́. А на десе́рт?"],["Все","Моро́женое! Шокола́дное!"],["Ва́ня","Счёт, пожа́луйста! Ско́лько сто́ит?"],["Официа́нт","Сто пятьдеся́т ты́сяч сум."]]},"reading":{"title":"Ва́ня и Ха́ки в магази́не","text":["В суббо́ту у́тром ма́ма дала́ Ва́не спи́сок: молоко́, хлеб, сыр, я́йца и я́блоки.","Ва́ня взял Ха́ки и пошёл в магази́н. Но соба́кам нельзя́ в магази́н! Ва́ня оста́вил Ха́ки у две́ри.","В магази́не Ва́ня купи́л молоко́, хлеб, сыр и я́йца. А я́блоки? Я́блоки он купи́л на ры́нке, там они́ вкусне́е.","Пото́м Ва́ня уви́дел моро́женое и купи́л одно́ — для себя́.","Когда́ он вы́шел, Ха́ки сиде́л и смотре́л на дверь. Ва́ня дал ему́ кусо́чек сы́ра. Ха́ки был о́чень рад!","До́ма ма́ма спроси́ла: «А где сыр?» Ва́ня засмея́лся: «Ма́ма, сыр есть. Но немно́го ме́ньше!»"]}},"17":{"num":"17","title":"Куда́ ты идёшь?","titleUz":"Qayerga ketyapsan?","words":[["шко́ла","maktab"],["стадио́н","stadion"],["бассе́йн","basseyn"],["кинотеа́тр","kinoteatr"],["библиоте́ка","kutubxona"],["вокза́л","vokzal"],["аэропо́рт","aeroport"],["дере́вня","qishloq"],["конце́рт","konsert"],["зоопа́рк","hayvonot bog'i"],["по́езд","poyezd"],["самолёт","samolyot"]],"phrases":[["Куда́ вы идёте?","Qayerga ketyapsizlar?"],["Мы идём в бассе́йн.","Basseynga ketyapmiz."],["Я иду́ в парк.","Parkka ketyapman."],["ве́чером","kechqurun"],["Мы е́дем на конце́рт.","Konsertga ketyapmiz."],["Я то́же хочу́!","Men ham xohlayman!"],["Пое́хали вме́сте!","Birga ketdik!"],["на такси́","taksida"],["Отли́чно!","Zo'r!"],["Ты сего́дня до́ма.","Sen bugun uydasan."]],"dialogue":{"title":"Диало́г «Куда́ вы идёте?»","intro":"Yakshanba ertalab. Vanya Haki bilan ko'chada Timur va Malikani uchratdi.","lines":[["Ва́ня","Приве́т! Куда́ вы идёте?"],["Мали́ка","Мы идём в бассе́йн. А ты?"],["Ва́ня","А я иду́ в парк. Ха́ки лю́бит парк!"],["Тиму́р","А ве́чером мы е́дем на конце́рт."],["Ва́ня","На конце́рт? Я то́же хочу́!"],["Мали́ка","Пое́хали вме́сте! Мы е́дем на такси́."],["Ва́ня","Отли́чно! Ха́ки, а ты сего́дня до́ма!"],["Ха́ки","Гав… гав…"]]},"reading":{"title":"Пое́здка в Ташке́нт","text":["В ма́е Мали́ка, Тиму́р и их па́па е́здили в Ташке́нт. Они́ е́хали на ско́ром по́езде «Афросиа́б». По́езд е́хал два часа́.","Снача́ла они́ пошли́ в зоопа́рк. Там они́ ви́дели слона́, жира́фа и большо́го льва.","Пото́м па́па сказа́л: «Тепе́рь идём в музе́й!» Тиму́р не хоте́л в музе́й, он хоте́л на стадио́н.","Но в музе́е бы́ло о́чень интере́сно! Там Тиму́р уви́дел ста́рую раке́ту и большу́ю ка́рту ко́смоса.","Ве́чером они́ е́здили на метро́. Мали́ке о́чень понра́вилось ташке́нтское метро́ — оно́ как музе́й!","Но́чью они́ е́хали домо́й. Ба́рсик и ма́ма жда́ли их до́ма."]}},"18":{"num":"18","title":"У меня́ есть …","titleUz":"Menda … bor","words":[["соба́ка","it"],["ко́шка","mushuk"],["попуга́й","to'tiqush"],["ры́бка","baliqcha"],["хомя́к","hamster"],["черепа́ха","toshbaqa"],["телефо́н","telefon"],["планше́т","planshet"],["нау́шники","quloqchin"],["велосипе́д","velosiped"],["фотоаппара́т","fotoapparat"],["часы́","soat"]],"phrases":[["Ребя́та!","Bolalar!"],["У кого́ есть …?","Kimda … bor?"],["пито́мец","uy hayvoni"],["Её зову́т …","Uning ismi …"],["У нас есть …","Bizda … bor"],["лени́вый","dangasa"],["споко́йный","xotirjam"],["У тебя́ есть …?","Senda … bormi?"],["нет ни … , ни …","na … , na … yo'q"],["У меня́ нет …","Menda … yo'q"]],"dialogue":{"title":"Диало́г «У тебя́ есть пито́мец?»","intro":"Sinfda o'qituvchi Olga Petrovna yangi mavzuni boshladi: «Uy hayvonlari».","lines":[["О́льга Петро́вна","Ребя́та, у кого́ есть пито́мец?"],["Ва́ня","У меня́ есть соба́ка. Её зову́т Ха́ки!"],["Мали́ка","А у нас есть кот Ба́рсик. Он се́рый и о́чень лени́вый."],["Тиму́р","Не лени́вый, а споко́йный!"],["О́льга Петро́вна","Ди́ла, а у тебя́ есть пито́мец?"],["Ди́ла","Нет, у меня́ нет ни соба́ки, ни ко́шки. Но у меня́ есть ры́бки!"],["Тиму́р","А у меня́ нет пито́мца… Но у меня́ есть сестра́!"],["Мали́ка","Тиму́р!"]]},"reading":{"title":"Пито́мцы на́шего кла́сса","text":["В на́шем кла́ссе два́дцать учени́ков. И почти́ у всех есть пито́мцы!","У Ва́ни есть ха́ски Ха́ки. Ему́ четы́ре ме́сяца. Он о́чень весёлый, но иногда́ ест ту́фли.","У Мали́ки и Тиму́ра есть кот Ба́рсик. Он лю́бит спать на окне́ и смотре́ть на птиц.","У Ди́лы есть ры́бки. Их пять: две кра́сные и три жёлтые. А у Ази́за есть попуга́й Ке́ша. Он уме́ет говори́ть «Приве́т»!","А у О́льги Петро́вны, на́шей учи́тельницы, есть больша́я черепа́ха. Ей уже́ три́дцать лет!","То́лько у Ки́ры нет пито́мца. Но у неё есть мечта́ — ло́шадь!"]}},"19":{"num":"19","title":"Ско́лько?","titleUz":"Qancha?","words":[["рис","guruch"],["мя́со","go'sht"],["морко́вь","sabzi"],["лук","piyoz"],["чесно́к","sarimsoq"],["ма́сло","yog'"],["соль","tuz"],["помидо́р","pomidor"],["огуре́ц","bodring"],["каза́н","qozon"],["килогра́мм","kilogramm"],["буты́лка","shisha"]],"phrases":[["спи́сок","ro'yxat"],["три кило́ ри́са","uch kilo guruch"],["Так мно́го?","Shuncha ko'pmi?"],["Ско́лько госте́й?","Nechta mehmon?"],["двена́дцать челове́к","o'n ikki kishi"],["для пло́ва","palov uchun"],["Ско́лько сто́ит?","Qancha turadi?"],["Ско́лько вам?","Sizga qancha?"],["пять лу́ковиц","beshta piyoz"],["Я хочу́ есть!","Qornim och!"]],"dialogue":{"title":"Диало́г «На ры́нке»","intro":"Shanba kuni Timurlarning uyida palov bo'ladi. Timur va Vanya Siyob bozoriga borishdi.","lines":[["Тиму́р","Ва́ня, ма́ма дала́ спи́сок: три кило́ ри́са, два кило́ морко́ви…"],["Ва́ня","Так мно́го? Ско́лько госте́й бу́дет?"],["Тиму́р","Двена́дцать челове́к! Плов — э́то пра́здник!"],["Продаве́ц","Морко́вь! Жёлтая морко́вь для пло́ва!"],["Ва́ня","Ско́лько сто́ит килогра́мм?"],["Продаве́ц","Во́семь ты́сяч. Ско́лько вам?"],["Тиму́р","Два кило́, пожа́луйста. И пять лу́ковиц."],["Ва́ня","А мне одну́ лепёшку! Я уже́ хочу́ есть!"]]},"reading":{"title":"Реце́пт пло́ва от ба́бушки Тиму́ра","text":["Плов — гла́вное блю́до в Узбекиста́не. Ба́бушка Тиму́ра гото́вит са́мый вку́сный плов в Самарка́нде.","Для пло́ва на во́семь челове́к ну́жно: оди́н килогра́мм ри́са, оди́н килогра́мм мя́са, оди́н килогра́мм морко́ви, три лу́ковицы, две голо́вки чеснока́ и стака́н ма́сла.","Снача́ла ба́бушка нагрева́ет ма́сло в казане́. Пото́м жа́рит мя́со и лук.","Зате́м она́ кладёт морко́вь. Морко́вь для пло́ва должна́ быть жёлтая и о́чень то́нкая.","Пото́м ба́бушка кладёт рис, чесно́к и соль и налива́ет во́ду. Плов гото́вится час.","«Гла́вный секре́т, — говори́т ба́бушка, — э́то не рис и не мя́со. Э́то любо́вь!»"]}},"20":{"num":"20","title":"Отку́да ты?","titleUz":"Qayerdansan?","words":[["Узбекиста́н","O'zbekiston"],["Росси́я","Rossiya"],["Казахста́н","Qozog'iston"],["Ту́рция","Turkiya"],["Кита́й","Xitoy"],["Япо́ния","Yaponiya"],["Герма́ния","Germaniya"],["Фра́нция","Fransiya"],["Ита́лия","Italiya"],["А́нглия","Angliya"],["Аме́рика (США)","Amerika (AQSH)"],["Еги́пет","Misr"]],"phrases":[["Отку́да ты?","Qayerdansan?"],["Я из Япо́нии.","Men Yaponiyadanman."],["Ты говори́шь по-ру́сски?","Ruscha gapirasanmi?"],["Немно́го.","Ozgina."],["Я не отсю́да.","Men bu yerlik emasman."],["из Москвы́","Moskvadan"],["А я ду́мал, …","Men esa … deb o'ylabman"],["по́сле уро́ков","darslardan keyin"],["без тебя́","sensiz"],["С удово́льствием!","Jon deb!"]],"dialogue":{"title":"Диало́г «Но́вый учени́к»","intro":"Sinfga yangi o'quvchi keldi. Tanaffusda bolalar u bilan tanishishdi.","lines":[["Мали́ка","Приве́т! Ты но́вый? Отку́да ты?"],["Ке́нджи","Приве́т! Меня́ зову́т Ке́нджи. Я из Япо́нии."],["Тиму́р","Из Япо́нии?! А ты говори́шь по-ру́сски?"],["Ке́нджи","Немно́го. Мой па́па рабо́тает здесь, в Самарка́нде."],["Ва́ня","Я то́же не отсю́да. Я из Москвы́!"],["Ке́нджи","А я ду́мал, ты узбе́к!"],["Мали́ка","По́сле уро́ков пойдём в парк? Без тебя́ не пойдём!"],["Ке́нджи","С удово́льствием! Спаси́бо!"]]},"reading":{"title":"Самарка́нд — го́род госте́й","text":["Самарка́нд — о́чень ста́рый го́род. Ему́ бо́льше двух ты́сяч семисо́т лет. Сюда́ приезжа́ют тури́сты из ра́зных стран.","Вчера́ Мали́ка с па́пой бы́ли на Региста́не. Там бы́ли тури́сты из Ита́лии, из Фра́нции и да́же из Еги́пта.","Одна́ де́вочка из Ту́рции спроси́ла Мали́ку по-англи́йски: «Где здесь вку́сный плов?» Мали́ка отве́тила и показа́ла доро́гу.","Пото́м Мали́ка познако́милась с гру́ппой из Росси́и. Они́ прие́хали из Каза́ни. Мали́ка говори́ла с ни́ми по-ру́сски — и они́ о́чень удиви́лись!","Ве́чером Мали́ка сказа́ла па́пе: «Я хочу́ знать мно́го языко́в. Без языко́в нельзя́ узна́ть мир!»"]}},"21":{"num":"21","title":"Пра́здники и пода́рки","titleUz":"Bayramlar va sovg'alar","words":[["пода́рок","sovg'a"],["откры́тка","tabriknoma"],["цветы́","gullar"],["торт","tort"],["све́чи","shamlar"],["ёлка","archa"],["сумаля́к","sumalak"],["ша́рики","sharchalar"],["салю́т","salyut"],["Дед Моро́з","Qorbobo"],["игру́шка","o'yinchoq"],["конфе́ты","konfetlar"]],"phrases":[["Что подари́ть ма́ме?","Onamga nima sovg'a qilay?"],["Я дарю́ ма́ме …","Onamga … sovg'a qilaman"],["что́-то осо́бенное","nimadir alohida"],["Я помогу́ тебе́!","Senga yordam beraman!"],["Дава́й сде́лаем …","Keling, … qilamiz"],["Дорога́я ма́ма!","Aziz onajon!"],["Поздравля́ю тебя́!","Seni tabriklayman!"],["Позвони́ ба́бушке!","Buvingga qo'ng'iroq qil!"],["спой ей пе́сню","unga qo'shiq kuylab ber"],["Лу́чше …","Yaxshisi …"]],"dialogue":{"title":"Диало́г «Что подари́ть ма́ме?»","intro":"Ertaga 8-mart. Timur va Vanya onalariga sovg'a qidirishyapti.","lines":[["Тиму́р","За́втра 8 Ма́рта! Что подари́ть ма́ме?"],["Ва́ня","Я дарю́ ма́ме цветы́. Она́ лю́бит тюльпа́ны."],["Тиму́р","А я хочу́ подари́ть ей что́-то осо́бенное…"],["Мали́ка","Я помогу́ тебе́! Дава́й сде́лаем откры́тку!"],["Мали́ка","Напиши́: «Дорога́я ма́ма! Поздравля́ю тебя́!»"],["Тиму́р","А что подари́ть ба́бушке?"],["Ва́ня","Позвони́ ба́бушке и спой ей пе́сню!"],["Тиму́р","Пе́сню? Нет! Лу́чше торт!"]]},"reading":{"title":"Навру́з в семье́ Тиму́ра","text":["Навру́з — са́мый люби́мый пра́здник в Узбекиста́не. Его́ пра́зднуют два́дцать пе́рвого ма́рта. Э́то пра́здник весны́ и но́вого го́да.","В семье́ Тиму́ра ба́бушка ва́рит сумаля́к. Его́ ва́рят всю ночь, и все помога́ют ба́бушке. Тиму́р и Ва́ня то́же меша́ют сумаля́к и пою́т пе́сни.","У́тром ма́ма гото́вит плов. Мали́ка дари́т ба́бушке откры́тку, а па́па дари́т ма́ме цветы́.","Ва́ня впервы́е пра́зднует Навру́з. Он звони́т ба́бушке в Москву́ и расска́зывает ей о пра́зднике.","«Ба́бушка, здесь Навру́з как Но́вый год, но весно́й!» Ба́бушка смеётся: «Поздравля́ю вас всех! Жела́ю вам сча́стья!»"]}},"22":{"num":"22","title":"Как ты себя́ чу́вствуешь?","titleUz":"O'zingni qanday his qilyapsan?","words":[["голова́","bosh"],["го́рло","tomoq"],["зуб","tish"],["у́хо","quloq"],["живо́т","qorin"],["рука́","qo'l"],["нога́","oyoq"],["спина́","bel, orqa"],["врач","shifokor"],["лека́рство","dori"],["температу́ра","harorat"],["гра́дусник","termometr"]],"phrases":[["Что с тобо́й?","Senga nima bo'ldi?"],["Как ты себя́ чу́вствуешь?","O'zingni qanday his qilyapsan?"],["Пло́хо.","Yomon."],["Мне хо́лодно.","Menga sovuq."],["У меня́ боли́т голова́.","Boshim og'riyapti."],["Что у тебя́ боли́т?","Qayering og'riyapti?"],["Тебе́ ну́жно лежа́ть.","Yotishing kerak."],["чай с мёдом","asalli choy"],["Мне мо́жно?","Menga mumkinmi?"],["Тебе́ нельзя́.","Senga mumkin emas."]],"dialogue":{"title":"Диало́г «У врача́»","intro":"Dushanba ertalab Timur maktabga kelmadi. Malika uni shifokorga olib bordi.","lines":[["Мали́ка","Тиму́р, что с тобо́й? Как ты себя́ чу́вствуешь?"],["Тиму́р","Пло́хо. Мне хо́лодно, и у меня́ боли́т голова́."],["Врач","Здра́вствуй! Что у тебя́ боли́т?"],["Тиму́р","Голова́ и го́рло. И у меня́ температу́ра."],["Врач","Тебе́ ну́жно лежа́ть три дня и пить чай с мёдом."],["Тиму́р","А в шко́лу мне мо́жно?"],["Врач","Нет, тебе́ нельзя́. И моро́женое нельзя́!"],["Тиму́р","Моро́женое нельзя́?! Тепе́рь мне о́чень гру́стно…"]]},"reading":{"title":"Плохо́й день Ва́ни","text":["Вчера́ у Ва́ни был плохо́й день. У́тром ему́ бы́ло хо́лодно, и у него́ боле́ло го́рло.","Но Ва́не нра́вится шко́ла, и он пошёл на уро́ки. На уро́ке матема́тики у него́ заболе́ла голова́.","О́льга Петро́вна сказа́ла: «Ва́ня, тебе́ пло́хо? Тебе́ ну́жно домо́й». Ма́ма пришла́ и забра́ла его́.","Врач сказа́л: «У тебя́ просту́да. Тебе́ ну́жно лежа́ть и пить мно́го воды́. Гуля́ть нельзя́».","Ва́не бы́ло гру́стно и ску́чно. Но ве́чером пришли́ Тиму́р и Мали́ка. Они́ принесли́ фру́кты и откры́тку. А Ха́ки лёг ря́дом и не уходи́л весь ве́чер.","Ва́ня сказа́л: «Мне уже́ лу́чше! Спаси́бо, друзья́!»"]}},"23":{"num":"23","title":"Кем ты хо́чешь стать?","titleUz":"Kim bo'lishni xohlaysan?","words":[["врач","shifokor"],["учи́тель","o'qituvchi"],["лётчик","uchuvchi"],["космона́вт","kosmonavt"],["программи́ст","dasturchi"],["худо́жник","rassom"],["по́вар","oshpaz"],["футболи́ст","futbolchi"],["инжене́р","muhandis"],["журнали́ст","jurnalist"],["полице́йский","politsiyachi"],["музыка́нт","musiqachi"]],"phrases":[["Кем вы хоти́те стать?","Kim bo'lishni xohlaysizlar?"],["стать космона́втом","kosmonavt bo'lmoq"],["полете́ть на Марс","Marsga uchmoq"],["Я бу́ду худо́жницей.","Rassom bo'laman."],["занима́ться рисова́нием","rasm bilan shug'ullanmoq"],["с шести́ лет","olti yoshdan"],["Молоде́ц!","Barakalla!"],["рабо́тать с живо́тными","hayvonlar bilan ishlamoq"],["три ра́за в день","kuniga uch marta"],["потому́ что","chunki"]],"dialogue":{"title":"Диало́г «Кем ты бу́дешь?»","intro":"Maktabda «Kasblar kuni». Olga Petrovna o'quvchilardan orzularini so'rayapti.","lines":[["О́льга Петро́вна","Ребя́та, кем вы хоти́те стать?"],["Тиму́р","Я хочу́ стать космона́втом и полете́ть на Марс!"],["Мали́ка","А я бу́ду худо́жницей. Я занима́юсь рисова́нием с шести́ лет."],["О́льга Петро́вна","Молоде́ц! А ты, Ва́ня?"],["Ва́ня","Я хочу́ быть ветерина́ром. Я люблю́ рабо́тать с живо́тными!"],["Тиму́р","Да! Он гуля́ет с Ха́ки три ра́за в день!"],["О́льга Петро́вна","А я ста́ла учи́тельницей, потому́ что люблю́ дете́й."],["Все","А мы лю́бим вас, О́льга Петро́вна!"]]},"reading":{"title":"День профе́ссий","text":["В пя́тницу в на́шей шко́ле был День профе́ссий. К нам пришли́ роди́тели и расска́зывали о свое́й рабо́те.","Па́па Ва́ни — инжене́р. Он стро́ит мосты́. Ра́ньше он рабо́тал в Москве́, а тепе́рь рабо́тает здесь, в Узбекиста́не.","Ма́ма Тиму́ра и Мали́ки — врач. Она́ рабо́тает в де́тской больни́це. Она́ сказа́ла: «Врачо́м быть тру́дно, но интере́сно!»","А па́па Ди́лы — по́вар. Он принёс большо́й торт с фру́ктами, и все бы́ли о́чень ра́ды!","По́сле э́того Тиму́р сказа́л: «Я всё равно́ бу́ду космона́втом. Но в ко́смосе мне ну́жен по́вар!» Все засмея́лись."]}},"24":{"num":"24","title":"Где лежи́т телефо́н?","titleUz":"Telefon qayerda yotibdi?","words":[["по́лка","javon"],["ла́мпа","chiroq"],["карти́на","rasm (devordagi)"],["зе́ркало","oyna, ko'zgu"],["ковёр","gilam"],["подоко́нник","deraza tokchasi"],["поду́шка","yostiq"],["одея́ло","ko'rpa"],["ту́мбочка","tumbochka"],["рюкза́к","ryukzak"],["кроссо́вки","krossovka"],["заря́дка","zaryadka (quvvatlagich)"]],"phrases":[["Ты не ви́дела …?","… ko'rmadingmi?"],["По-мо́ему, …","Menimcha, …"],["ря́дом с ла́мпой","chiroq yonida"],["там его́ нет","u yerda yo'q"],["под столо́м","stol tagida"],["под поду́шкой","yostiq tagida"],["за дива́ном","divan orqasida"],["Мы опа́здываем!","Kechikyapmiz!"],["на подоко́ннике","deraza tokchasida"],["под ним","uning tagida"]],"dialogue":{"title":"Диало́г «Где мой телефо́н?»","intro":"Ertalab. Timur maktabga kechikyapti, telefonini esa topa olmayapti.","lines":[["Тиму́р","Мали́ка! Ты не ви́дела мой телефо́н?"],["Мали́ка","По-мо́ему, он лежи́т на столе́, ря́дом с ла́мпой."],["Тиму́р","Нет, там его́ нет! Ни на столе́, ни под столо́м!"],["Мали́ка","А под поду́шкой? Ты игра́л ве́чером!"],["Тиму́р","Нет… И за дива́ном нет, и в рюкзаке́ нет!"],["Ма́ма","Тиму́р! Мы опа́здываем!"],["Мали́ка","Смотри́! Ба́рсик спит на подоко́ннике… а под ним — твой телефо́н!"],["Тиму́р","Ба́рсик!"]]},"reading":{"title":"Мали́ка и её ко́мната","text":["Э́то ко́мната Мали́ки. Она́ не о́чень больша́я, но све́тлая и ую́тная.","Крова́ть стои́т у окна́. Над крова́тью виси́т большо́й пла́кат — э́то карти́на Мали́ки «Самарка́нд но́чью».","Ме́жду крова́тью и шка́фом стои́т стол. На столе́ лежа́т карандаши́, кра́ски и альбо́м. Над столо́м виси́т ла́мпа.","На подоко́ннике стоя́т цветы́. Там ча́сто спит Ба́рсик — ему́ нра́вится смотре́ть на у́лицу.","Под крова́тью лежи́т кра́сный мяч. Э́то мяч Ха́ки! Ва́ня забы́л его́, когда́ приходи́л в го́сти.","Мали́ка говори́т: «Моя́ ко́мната — моё люби́мое ме́сто в ми́ре!»"]}},"p3":{"num":"П3","title":"Повторе́ние 3","titleUz":"Takrorlash: 13–18-darslar","reading":{"title":"Суббо́та в Самарка́нде","text":["В суббо́ту у́тром Ва́ня, Тиму́р и Мали́ка пое́хали в центр на авто́бусе. Ха́ки, коне́чно, то́же был с ни́ми.","Снача́ла они́ бы́ли на ры́нке. Там Мали́ка купи́ла я́блоки, а Тиму́р — лепёшку. Ва́ня купи́л для ба́бушки краси́вую пиалу́.","Пото́м они́ пошли́ в кафе́ на пло́щади. Тиму́р ел пи́ццу, Мали́ка пила́ сок, а Ва́ня взял моро́женое. Ха́ки сиде́л под столо́м и ждал.","По доро́ге домо́й они́ говори́ли о кино́ и о свои́х мечта́х. «У меня́ есть иде́я, — сказа́л Ва́ня. — За́втра идём в музе́й!»"]}},"p4":{"num":"П4","title":"Повторе́ние 4","titleUz":"Yakuniy takrorlash","reading":{"title":"Год в Самарка́нде","text":["Ва́ня живёт в Самарка́нде уже́ год. Ра́ньше он жил в Москве́, а тепе́рь у него́ здесь но́вый дом, но́вая шко́ла и но́вые друзья́.","Ва́ня мно́го говори́т по-узбе́кски, а Тиму́р и Мали́ка тепе́рь хорошо́ говоря́т по-ру́сски. Они́ всегда́ помога́ют друг дру́гу.","Ле́том Ва́ня е́дет в Москву́ к ба́бушке. Он везёт ей пода́рки: пиалу́, сла́дости и карти́ну Мали́ки «Региста́н».","«Мне бу́дет гру́стно без вас», — говори́т Ва́ня. «А мне — без Ха́ки!» — смеётся Мали́ка. Но Ха́ки е́дет с Ва́ней. Ба́бушка о́чень хо́чет его́ уви́деть!"]}}};

const $ = (s) => document.querySelector(s);
const clean = (t) => t.replace(/\u0301/g, "").replace(/\[[^\]]*\]/g, "").replace(/\u2014/g, ",").replace(/\s+/g, " ").trim();
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function lessonId() {
  const q = new URLSearchParams(location.search).get("id");
  if (q) return q.toLowerCase();
  const seg = location.pathname.replace(/\/+$/, "").split("/").pop().toLowerCase();
  return DATA[seg] ? seg : null;
}

// ---- TTS ----
let ruVoice = null, rate = 0.85, queue = [], playingEl = null, stopFlag = false;
function pickVoice() { const v = speechSynthesis.getVoices(); ruVoice = v.find((x) => /ru(-|_)RU/i.test(x.lang)) || v.find((x) => /^ru/i.test(x.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let curAudio = null, serverTTS = true;
const RATE_MAP = { 0.7: 0.8, 0.85: 0.9, 1: 1 };
function mark(el) { if (playingEl) playingEl.classList.remove("playing"); if (el) { el.classList.add("playing"); playingEl = el; } }
function browserSpeak(text, el) {
  return new Promise((res) => {
    if (!("speechSynthesis" in window)) { $("#warn") && ($("#warn").style.display = "block"); return res(); }
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = "ru-RU"; u.rate = rate; if (ruVoice) u.voice = ruVoice;
    mark(el);
    u.onend = u.onerror = () => { el && el.classList.remove("playing"); res(); };
    speechSynthesis.speak(u);
  });
}
function speak(text, el) {
  if (!serverTTS) return browserSpeak(text, el);
  return new Promise((res) => {
    mark(el); if (el) el.classList.add("loading");
    const a = new Audio("/api/kitob1-tts?t=" + encodeURIComponent(clean(text)));
    curAudio = a; a.playbackRate = RATE_MAP[rate] || 1;
    let done = false; const fin = () => { if (done) return; done = true; el && el.classList.remove("playing", "loading"); res(); };
    a.onended = fin;
    a.onerror = () => { if (done) return; done = true; serverTTS = false; el && el.classList.remove("loading"); browserSpeak(text, el).then(res); };
    a.onplaying = () => el && el.classList.remove("loading");
    a.play().catch(() => { if (!done) { done = true; el && el.classList.remove("loading"); browserSpeak(text, el).then(res); } });
  });
}
function stopAll() { stopFlag = true; if (curAudio) { curAudio.pause(); curAudio = null; } if ("speechSynthesis" in window) speechSynthesis.cancel(); document.querySelectorAll(".playing,.loading").forEach((e) => e.classList.remove("playing", "loading")); const b = $("#playall"); if (b) { b.textContent = "▶ Hammasini tinglash"; b.classList.remove("stop"); } }
async function playAll(btn) {
  if (btn.classList.contains("stop")) return stopAll();
  stopAll(); stopFlag = false; btn.textContent = "■ To'xtatish"; btn.classList.add("stop");
  for (const el of document.querySelectorAll("#panel .item")) { if (stopFlag) break; el.scrollIntoView({ block: "center", behavior: "smooth" }); await speak(el.dataset.say, el); await new Promise((r) => setTimeout(r, 350)); }
  stopAll();
}

// ---- Rendering ----
const SECTIONS = [
  ["sozlar", "🔤 So'zlar", (L) => L.words],
  ["iboralar", "💬 Iboralar", (L) => L.phrases],
  ["dialog", "🎭 Dialog", (L) => L.dialogue],
  ["matn", "📖 Matn", (L) => L.reading],
];
let cur = null;

function audioBlock(id, part) {
  return `<div class="player" id="pl"><button class="playall" id="playall" onclick="playAll(this)">▶ Hammasini tinglash</button>
    <div class="speed">Tezlik <button data-r="0.7">0.7</button><button data-r="0.85" class="on">0.85</button><button data-r="1">1×</button></div></div>
    <div id="rec"></div><div class="warn" id="warn">Bu brauzerda ovoz chiqarish ishlamayapti. Chrome yoki Safari'da oching.</div>`;
}
function tryRecorded(id, part) {
  const url = `${AUDIO_BASE}/${id}/${part}.mp3`;
  const a = new Audio(); a.preload = "metadata";
  a.onloadedmetadata = () => { const r = $("#rec"); if (r) r.innerHTML = `<div class="player"><span class="note" style="flex:none">🎧 O'qituvchi ovozi:</span><audio controls src="${url}"></audio></div>`; };
  a.src = url;
}
function render(part) {
  stopAll();
  const L = DATA[cur]; const P = $("#panel");
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.p === part));
  let html = "";
  if (part === "sozlar" || part === "iboralar") {
    const list = part === "sozlar" ? L.words : L.phrases;
    html += `<h2>${part === "sozlar" ? "Но́вые слова́" : "Поле́зные фра́зы"}</h2><p class="hint">${part === "sozlar" ? "Yangi so'zlar" : "Foydali iboralar"} · bosing va tinglang, keyin takrorlang</p>` + audioBlock(cur, part);
    html += list.map(([ru, uz, say]) => `<div class="item" data-say="${esc(say || ru)}"><div class="spk">🔊</div><div><div class="ru">${esc(ru)}</div><div class="uz">${esc(uz)}</div></div></div>`).join("");
  } else if (part === "dialog") {
    const d = L.dialogue;
    html += `<h2>${esc(d.title)}</h2><p class="hint">${esc(d.intro)}</p>` + audioBlock(cur, part);
    html += d.lines.map(([w, t]) => `<div class="item" data-say="${esc(t)}"><div class="spk">🔊</div><div>${w ? `<div class="who ${clean(w)}">${esc(w)}</div>` : ""}<div class="ru">${esc(t)}</div></div></div>`).join("");
  } else {
    const r = L.reading;
    html += `<h2>Чита́ем</h2><p class="hint">O'qiymiz · avval tinglang, keyin o'zingiz ovoz chiqarib o'qing</p>` + audioBlock(cur, part);
    html += `<h3 class="rt">${esc(r.title)}</h3><div class="para">` + r.text.map((t) => `<div class="item" data-say="${esc(t)}">${esc(t)}</div>`).join("") + "</div>";
  }
  P.innerHTML = html;
  P.querySelectorAll(".item").forEach((el) => (el.onclick = () => { stopAll(); speak(el.dataset.say, el); }));
  P.querySelectorAll(".speed button").forEach((b) => (b.onclick = () => { rate = +b.dataset.r; P.querySelectorAll(".speed button").forEach((x) => x.classList.toggle("on", x === b)); }));
  tryRecorded(cur, part);
  history.replaceState(null, "", "#" + part);
}
function renderIndex() {
  $("#hero").innerHTML = `<div class="badge">1<small>KITOB</small></div><div><h1>Говори́м по-ру́сски!</h1><p>Darsni tanlang va tinglang</p></div>`;
  $("#tabs").style.display = "none"; $("#panel").style.display = "none";
}
function init() {
  cur = lessonId();
  $("#grid").innerHTML = ORDER.map((k) => `<a href="/kitob2/${k}" class="${k === cur ? "cur" : ""}"><span>${esc(DATA[k].num)}</span>${esc(DATA[k].title.replace(/́/g, ""))}</a>`).join("");
  if (!cur) return renderIndex();
  const L = DATA[cur];
  document.title = `${L.title.replace(/́/g, "")} · Kitob 2 · Akademiya Pushkina`;
  const small = /^p/.test(cur) ? "ПОВТОР." : /^k/.test(cur) ? "ВВОДНЫЙ" : "УРОК";
  $("#hero").innerHTML = `<div class="badge">${esc(L.num)}<small>${small}</small></div><div><h1>${esc(L.title)}</h1><p>${esc(L.titleUz)}</p></div>`;
  const avail = SECTIONS.filter(([, , g]) => { const v = g(L); return v && (Array.isArray(v) ? v.length : true); });
  $("#tabs").innerHTML = avail.map(([p, t]) => `<button class="tab" data-p="${p}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => render(t.dataset.p)));
  const want = location.hash.slice(1);
  render(avail.some(([p]) => p === want) ? want : avail[0][0]);
}
init();
</script>
